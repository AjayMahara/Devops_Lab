apiVersion : apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx-deployment

spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-app
  template: 
    metadata:
      name: nginx-2
      labels:
        app: nginx-app
        env: production 
    spec:
      containers:
        - name: nginx
          image: nginx