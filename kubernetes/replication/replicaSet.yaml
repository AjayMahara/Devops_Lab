apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx-replicaset
  labels:
    app: nginx-replicaset
    env: prod

spec:
  selector:
    matchLabels:
      app: nginx-app
  replicas: 3
  template: 
    metadata:
      name: nginx-2
      labels:
        app: nginx-app
        env: production 
    spec:
      containers:
        - name: nginx
          image: nginx
    