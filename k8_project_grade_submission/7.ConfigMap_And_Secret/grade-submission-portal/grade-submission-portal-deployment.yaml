apiVersion: apps/v1
kind: Deployment
metadata:
  name: grade-submission-portal-deployment
  namespace: grade-submission
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: grade-submission-portal
  template:
    metadata:
      name: grade-submission-portal
      labels:
        app.kubernetes.io/name: grade-submission 
        app.kubernetes.io/component: frontend
        app.kubernetes.io/instance: grade-submission-portal
    spec:
      containers:
      - name: grade-submission-portal
        image: rslim087/kubernetes-course-grade-submission-portal
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5001
          initialDelaySeconds: 15 # Like grace period to wait before the application has complated startup .
          periodSeconds: 5 # Probe every 5 seconds to check liveness of application
        readinessProbe:
          httpGet:
            path: /readyz
            port: 5001
          periodSeconds: 5 # Probe every 5 seconds to check readiness of application
        envFrom:
          - configMapRef:
              name: grade-submission-portal-configs
        resources:
          requests:
            memory: "128Mi"
            cpu: "200m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        ports:
          - containerPort: 5001 
