apiVersion: v1
kind: Service
metadata:
  name: grade-submission-portal-service
  namespace: grade-submission
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: grade-submission-portal
  ports:
  - port: 5001
    targetPort: 5001
    nodePort: 31000

# I am using Minikube with docker env , so to get the URL for frontend need to use below command 
# minikube service <Your Service Name> --url
# In my case the command will be :  minikube service grade-submission-portal-service --url